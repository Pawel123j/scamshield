services:
  scamshield-senior:
    container_name: scamshield-senior
    build:
      context: .
      dockerfile: Dockerfile
      # Środowisko deweloperskie; obraz produkcyjny to domyślny etap `runner`.
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0
