name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, typecheck, testy, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        # `next build` sprawdza typy tylko w plikach, które wciągnie do
        # bundla — testy i pliki pomocnicze zostają poza kontrolą. Osobny
        # `tsc --noEmit` obejmuje cały projekt.
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Audyt zależności
        # Verify the versioned parser patch and fail on all other low/moderate/high/critical findings.
        run: npm run security:check

      - name: Build project
        run: npm run build

  docker-smoke:
    name: Docker install and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image including the committed dependency patch
        run: docker build --tag scamshield:ci .
      - name: Start the documented local-development container
        run: docker run --detach --name scamshield-ci --publish 127.0.0.1:18313:3000 scamshield:ci
      - name: Wait for and verify the actual analyzer page
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:18313/analyze > /tmp/scamshield.html; do sleep 2; done'
          python -c "from pathlib import Path; assert 'Sprawdź wiadomość' in Path('/tmp/scamshield.html').read_text()"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs scamshield-ci || true
          docker rm --force scamshield-ci || true
