name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, typecheck, testy, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Typecheck
        # `next build` sprawdza typy tylko w plikach, które wciągnie do
        # bundla — testy i pliki pomocnicze zostają poza kontrolą. Osobny
        # `tsc --noEmit` obejmuje cały projekt.
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Audyt zależności
        # Verify the versioned parser patch and fail on all other high/critical findings.
        # na `high`, żeby nowy komunikat o podatności o niskiej wadze nie
        # zapalał CI na czerwono na commicie, którego nikt nie dotykał.
        run: npm run security:check

      - name: Build project
        run: npm run build
